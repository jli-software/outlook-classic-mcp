name: Release

# Tag pushen -> EXE bauen -> GitHub-Release mit Changelog-Abschnitt
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tag matches version
        shell: bash
        run: |
          version=$(sed -n 's/^const version = "\(.*\)"/\1/p' main.go)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match main.go ($version)"
            exit 1
          fi

      - name: Tests
        run: |
          go vet .
          go build -o outlook-classic-mcp.exe .
          go test .

      - name: Build release EXE
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o out/outlook-classic-mcp-windows-x64.exe .
          ./out/outlook-classic-mcp-windows-x64.exe version

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      mcpb_sha: ${{ steps.mcpb.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: out

      # MCP-Bundle (.mcpb): fuer Claude Desktop per Doppelklick und das MCP-Registry
      - name: MCP bundle
        id: mcpb
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p bundle/server
          cp mcpb/icon.png bundle/
          jq --arg v "$version" '.version = $v' mcpb/manifest.json > bundle/manifest.json
          cp out/outlook-classic-mcp-windows-x64.exe bundle/server/outlook-classic-mcp.exe
          npx -y @anthropic-ai/mcpb@2.1.2 validate bundle/manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack bundle out/outlook-classic-mcp.mcpb
          echo "sha=$(sha256sum out/outlook-classic-mcp.mcpb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checksums
        working-directory: out
        run: sha256sum outlook-classic-mcp* > SHA256SUMS && cat SHA256SUMS

      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Install / update** (PowerShell):
          ```powershell
          irm https://raw.githubusercontent.com/jli-software/outlook-classic-mcp/main/install.ps1 | iex
          ```
          **Claude Desktop:** download `outlook-classic-mcp.mcpb` and open it.
          EOF
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "outlook-classic-mcp $GITHUB_REF_NAME" --notes-file notes.md --latest

  # Eintrag im offiziellen MCP-Registry (io.github.jli-software/…), Login per OIDC
  registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Version and checksum into server.json
        env:
          SHA: ${{ needs.release.outputs.mcpb_sha }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/jli-software/outlook-classic-mcp/releases/download/$GITHUB_REF_NAME/outlook-classic-mcp.mcpb"
          jq --arg v "$version" --arg u "$url" --arg s "$SHA" \
            '.version = $v | .packages[0].identifier = $u | .packages[0].fileSha256 = $s' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
